[package]
name = "nominal-labview-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Creates shared library (.dll/.so/.dylib)

[dependencies]
nominal-streaming = "0.10.4"
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
parking_lot = "0.12"
percent-encoding = "2"
url = "2"

# Reads the Windows proxy setting (Internet Settings in HKCU).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[profile.release]
opt-level = 3        # Maximum optimization for desktop
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization, slower compile

[profile.release-rt]
inherits = "release"
opt-level = 'z'      # Optimize for size (RT targets)
strip = true         # Remove debug symbols
panic = 'abort'      # Smaller binary
